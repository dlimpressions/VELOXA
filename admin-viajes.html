<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajes - Admin DriverHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-orb orb-1" style="opacity:0.15"></div>
    <nav class="navbar navbar-expand-lg navbar-futuristic">
        <div class="container-fluid">
            <a class="navbar-brand" href="admin-dashboard.html">🛡️ DriverHub Admin</a>
            <div class="d-flex align-items-center gap-3">
                <span style="color: var(--text-secondary); font-size: 0.9rem;">👋 Hola, <span class="user-name" style="color: var(--accent-cyan); font-weight: 600;">Admin</span></span>
                <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent-magenta),var(--accent-purple));display:flex;align-items:center;justify-content:center;font-weight:700;color:white;">
                    <span class="user-initial">A</span>
                </div>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar-futuristic collapse show">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">📊 Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="admin-conductores.html">👥 Conductores</a></li>
                        <li class="nav-item"><a class="nav-link active" href="admin-viajes.html">🚚 Viajes</a></li>
                        <li class="nav-item"><a class="nav-link" href="admin-pagos.html">💳 Pagos</a></li>
                        <li class="nav-item"><a class="nav-link" href="admin-reportes.html">📈 Reportes</a></li>
                        <li class="nav-item mt-3"><a class="nav-link" href="#" id="logoutBtn" style="color: var(--accent-danger);">🚪 Cerrar sesión</a></li>
                    </ul>
                </div>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" style="position:relative;z-index:1">
                <div class="pt-4 pb-3 mb-4 d-flex justify-content-between align-items-center flex-wrap">
                    <div><h1 class="text-gradient" style="font-size:1.75rem">Gestión de viajes</h1><p style="color:var(--text-secondary);margin:0">Crea, edita, asigna y elimina viajes</p></div>
                    <button class="btn-futuristic btn-primary-futuristic" onclick="abrirCrearViaje()"><span>➕ Nuevo viaje</span></button>
                </div>
                <div id="viajesAdminContainer"></div>
            </main>
        </div>
    </div>

    <!-- Modal para crear/editar viaje -->
    <div class="modal fade modal-futuristic" id="viajeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title text-gradient" id="viajeModalTitle">Nuevo viaje</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="viajeForm">
                        <input type="hidden" id="viajeId">
                        <div class="row g-3">
                            <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;font-weight:600;">Origen</label><input type="text" class="form-control" id="viajeOrigen" required style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"></div>
                            <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;font-weight:600;">Destino</label><input type="text" class="form-control" id="viajeDestino" required style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"></div>
                            <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;font-weight:600;">Fecha</label><input type="date" class="form-control" id="viajeFecha" required style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"></div>
                            <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;font-weight:600;">Hora</label><input type="time" class="form-control" id="viajeHora" style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"></div>
                            <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;font-weight:600;">Empresa</label><input type="text" class="form-control" id="viajeEmpresa" required style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"></div>
                            <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;font-weight:600;">Tipo vehículo</label><select class="form-select" id="viajeTipo" style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"><option value="Moto">🏍️ Moto</option><option value="Carro">🚗 Carro</option><option value="Furgón">🚐 Furgón</option><option value="Camioneta">🚛 Camioneta</option></select></div>
                            <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;font-weight:600;">Valor ($)</label><input type="number" class="form-control" id="viajeValor" required style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"></div>
                            <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;font-weight:600;">Peso (kg)</label><input type="number" class="form-control" id="viajePeso" style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"></div>
                            <div class="col-12"><label style="color:var(--text-secondary);font-size:0.8rem;text-transform:uppercase;font-weight:600;">Descripción</label><textarea class="form-control" id="viajeDescripcion" rows="2" style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"></textarea></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-futuristic btn-outline-futuristic" data-bs-dismiss="modal"><span>Cancelar</span></button>
                    <button type="button" class="btn-futuristic btn-primary-futuristic" id="btnGuardarViaje"><span>💾 Guardar viaje</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para asignar conductor -->
    <div class="modal fade modal-futuristic" id="asignarModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title text-gradient">Asignar conductor</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <p style="color:var(--text-secondary)">Selecciona un conductor aprobado para asignar a este viaje:</p>
                    <select class="form-select" id="selectConductor" style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;"></select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-futuristic btn-outline-futuristic" data-bs-dismiss="modal"><span>Cancelar</span></button>
                    <button type="button" class="btn-futuristic btn-success-futuristic" id="btnAsignarConfirm"><span>✅ Asignar</span></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-viajes.js"></script>
</body>
</html>
