<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductores - Admin DriverHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-orb orb-2" style="opacity:0.15"></div>
    <nav class="navbar navbar-expand-lg navbar-futuristic">
        <div class="container-fluid">
            <a class="navbar-brand" href="admin-dashboard.html">🛡️ DriverHub Admin</a>
            <div class="d-flex align-items-center gap-3">
                <span style="color: var(--text-secondary); font-size: 0.9rem;">👋 Hola, <span class="user-name" style="color: var(--accent-cyan); font-weight: 600;">Admin</span></span>
                <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent-magenta),var(--accent-purple));display:flex;align-items:center;justify-content:center;font-weight:700;color:white;">
                    <span class="user-initial">A</span>
                </div>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar-futuristic collapse show">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">📊 Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link active" href="admin-conductores.html">👥 Conductores</a></li>
                        <li class="nav-item"><a class="nav-link" href="admin-viajes.html">🚚 Viajes</a></li>
                        <li class="nav-item"><a class="nav-link" href="admin-pagos.html">💳 Pagos</a></li>
                        <li class="nav-item"><a class="nav-link" href="admin-reportes.html">📈 Reportes</a></li>
                        <li class="nav-item mt-3"><a class="nav-link" href="#" id="logoutBtn" style="color: var(--accent-danger);">🚪 Cerrar sesión</a></li>
                    </ul>
                </div>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" style="position:relative;z-index:1">
                <div class="pt-4 pb-3 mb-4">
                    <h1 class="text-gradient" style="font-size:1.75rem">Gestión de conductores</h1>
                    <p style="color:var(--text-secondary);margin:0">Aprueba o rechaza solicitudes, visualiza todos los conductores</p>
                </div>
                <ul class="nav nav-tabs mb-3" style="border-color:var(--border-subtle);">
                    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#pendientes">⏳ Pendientes</a></li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#todos">👥 Todos los conductores</a></li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="pendientes">
                        <div id="conductoresPendientesContainer"></div>
                    </div>
                    <div class="tab-pane fade" id="todos">
                        <div id="todosConductoresContainer"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal para motivo de rechazo -->
    <div class="modal fade modal-futuristic" id="rechazoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title text-gradient">Motivo de rechazo</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <label style="color:var(--text-secondary);font-size:0.9rem;">Explica el motivo para rechazar al conductor:</label>
                    <textarea class="form-control" id="motivoRechazo" rows="3" style="background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);color:white;border-radius:12px;padding:12px;margin-top:8px;"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-futuristic btn-outline-futuristic" data-bs-dismiss="modal"><span>Cancelar</span></button>
                    <button type="button" class="btn-futuristic btn-danger-futuristic" id="btnConfirmarRechazo"><span>✅ Rechazar</span></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-conductores.js"></script>
</body>
</html>
