<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - DriverHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-bg" style="position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(0,240,255,0.08),transparent 50%),radial-gradient(ellipse at bottom,rgba(112,0,255,0.08),transparent 50%);pointer-events:none;"></div>
    <div class="bg-orb orb-1" style="opacity:0.3;"></div>
    <div class="bg-orb orb-2" style="opacity:0.3;"></div>

    <div class="auth-page">
        <div class="auth-card" style="max-width:420px;">
            <div class="auth-logo">
                <div style="font-size:3rem;margin-bottom:0.5rem">🚚</div>
                <h2>DriverHub</h2>
                <p style="color:var(--text-secondary);font-size:0.9rem">Tu portal de conductor inteligente</p>
            </div>
            <form id="loginForm">
                <div style="position:relative;margin-bottom:1.5rem">
                    <input type="email" id="email" placeholder="Correo electrónico" required style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 16px 14px 48px;color:white;font-size:1rem;transition:all 0.3s">
                    <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1.1rem;opacity:0.5">📧</span>
                </div>
                <div style="position:relative;margin-bottom:1.5rem">
                    <input type="password" id="password" placeholder="Contraseña" required style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 16px 14px 48px;color:white;font-size:1rem;transition:all 0.3s">
                    <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1.1rem;opacity:0.5">🔒</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <label style="color:var(--text-secondary);font-size:0.85rem;display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" style="accent-color:var(--accent-cyan)"> Recordarme</label>
                    <a href="#" style="color:var(--accent-cyan);font-size:0.85rem;text-decoration:none">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn-futuristic btn-primary-futuristic w-100" style="padding:14px;font-size:1rem" id="loginBtn"><span>🚀 Ingresar al portal</span></button>
            </form>
            <div id="loginMessage" class="mt-3"></div>
            <div class="text-center mt-4" style="color:var(--text-secondary);font-size:0.9rem">¿No tienes cuenta? <a href="registro.html" style="color:var(--accent-cyan);text-decoration:none;font-weight:600">Regístrate gratis</a></div>
            <div class="text-center mt-3"><a href="index.html" style="color:var(--text-muted);text-decoration:none;font-size:0.85rem">← Volver al inicio</a></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span>⏳ Validando...</span>'; btn.disabled = true;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const result = await login(email, password);
                if (result.success) {
                    setConductorId(result.conductorId);
                    setConductorNombre(result.nombre);
                    showToast(`¡Bienvenido de vuelta, ${result.nombre}!`, 'success');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                } else {
                    showToast(result.message, 'error');
                    btn.innerHTML = originalText; btn.disabled = false;
                }
            } catch (error) {
                showToast('Error al iniciar sesión', 'error');
                btn.innerHTML = originalText; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
