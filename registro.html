<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Conductor - DriverHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-bg" style="position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(0,240,255,0.06),transparent 50%),radial-gradient(ellipse at bottom,rgba(112,0,255,0.06),transparent 50%);pointer-events:none"></div>
    <div class="bg-orb orb-1" style="opacity:0.2"></div>

    <div class="auth-page" style="padding:2rem 1rem">
        <div class="auth-card" style="max-width:700px;width:100%">
            <div class="auth-logo">
                <div style="font-size:2.5rem;margin-bottom:0.5rem">🚚</div>
                <h2>DriverHub</h2>
                <p style="color:var(--text-secondary);font-size:0.9rem">Crea tu cuenta en 3 simples pasos</p>
            </div>

            <div class="steps-container mb-4">
                <div class="step active" id="step1-indicator"><div class="step-number">1</div><div class="step-label">Personal</div></div>
                <div class="step" id="step2-indicator"><div class="step-number">2</div><div class="step-label">Vehículo</div></div>
                <div class="step" id="step3-indicator"><div class="step-number">3</div><div class="step-label">Cuenta</div></div>
            </div>

            <form id="registroForm">
                <div class="step-content active" id="step1">
                    <h5 class="text-gradient mb-3">👤 Información personal</h5>
                    <div class="row g-3">
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Nombre</label><input type="text" class="form-control" id="nombre" required placeholder="Tu nombre" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Apellido</label><input type="text" class="form-control" id="apellido" required placeholder="Tu apellido" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Cédula</label><input type="text" class="form-control" id="cedula" required placeholder="Número de cédula" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Fecha de nacimiento</label><input type="date" class="form-control" id="fechaNac" required style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Ciudad</label><input type="text" class="form-control" id="ciudad" required placeholder="Ciudad de operación" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Dirección</label><input type="text" class="form-control" id="direccion" required placeholder="Dirección residencial" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Correo electrónico</label><input type="email" class="form-control" id="email" required placeholder="correo@ejemplo.com" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Celular</label><input type="tel" class="form-control" id="celular" required placeholder="300 123 4567" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-12"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Foto de perfil (URL)</label><input type="url" class="form-control" id="fotoPerfil" placeholder="https://... (opcional)" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                    </div>
                    <div class="d-flex justify-content-end mt-4"><button type="button" class="btn-futuristic btn-primary-futuristic" onclick="nextStep(2)"><span>Siguiente →</span></button></div>
                </div>

                <div class="step-content" id="step2">
                    <h5 class="text-gradient mb-3">🚗 Información del vehículo</h5>
                    <div class="row g-3">
                        <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Tipo de vehículo</label><select class="form-select" id="tipoVehiculo" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"><option value="Moto">🏍️ Moto</option><option value="Carro">🚗 Carro</option><option value="Furgón">🚐 Furgón</option><option value="Camioneta">🚛 Camioneta</option></select></div>
                        <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Placa</label><input type="text" class="form-control" id="placa" required placeholder="ABC123" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Capacidad (kg)</label><input type="number" class="form-control" id="capacidad" required placeholder="500" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Marca</label><input type="text" class="form-control" id="marca" required placeholder="Marca del vehículo" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Modelo</label><input type="text" class="form-control" id="modelo" required placeholder="Modelo / Año" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">SOAT (URL)</label><input type="url" class="form-control" id="soat" placeholder="https://..." style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Tecnomecánica (URL)</label><input type="url" class="form-control" id="tecnomecanica" placeholder="https://..." style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-4"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Licencia (URL)</label><input type="url" class="form-control" id="licencia" placeholder="https://..." style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn-futuristic btn-outline-futuristic" onclick="prevStep(1)"><span>← Anterior</span></button>
                        <button type="button" class="btn-futuristic btn-primary-futuristic" onclick="nextStep(3)"><span>Siguiente →</span></button>
                    </div>
                </div>

                <div class="step-content" id="step3">
                    <h5 class="text-gradient mb-3">💳 Información bancaria y acceso</h5>
                    <div class="row g-3">
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Banco</label><input type="text" class="form-control" id="banco" placeholder="Bancolombia, Nequi, etc." style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Tipo de cuenta</label><select class="form-select" id="tipoCuenta" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"><option value="Ahorros">💰 Ahorros</option><option value="Corriente">💼 Corriente</option><option value="Nequi">📱 Nequi</option><option value="Daviplata">📲 Daviplata</option></select></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Número de cuenta</label><input type="text" class="form-control" id="numCuenta" placeholder="Número de cuenta" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Titular de la cuenta</label><input type="text" class="form-control" id="titular" placeholder="Nombre completo del titular" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Contraseña</label><input type="password" class="form-control" id="password" required placeholder="Mínimo 6 caracteres" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-md-6"><label style="color:var(--text-secondary);font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:block">Confirmar contraseña</label><input type="password" class="form-control" id="confirmPassword" required placeholder="Repite tu contraseña" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white"></div>
                        <div class="col-12"><label style="color:var(--text-secondary);font-size:0.9rem;display:flex;align-items:flex-start;gap:10px;cursor:pointer"><input type="checkbox" id="terminos" required style="margin-top:4px;accent-color:var(--accent-cyan)"><span>Acepto los <a href="#" style="color:var(--accent-cyan)">términos y condiciones</a> y la <a href="#" style="color:var(--accent-cyan)">política de privacidad</a> de DriverHub</span></label></div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn-futuristic btn-outline-futuristic" onclick="prevStep(2)"><span>← Anterior</span></button>
                        <button type="submit" class="btn-futuristic btn-success-futuristic" id="registroBtn"><span>✅ Completar registro</span></button>
                    </div>
                </div>
            </form>
            <div id="registroMessage" class="mt-3"></div>
            <div class="text-center mt-4" style="color:var(--text-secondary);font-size:0.9rem">¿Ya tienes cuenta? <a href="login.html" style="color:var(--accent-cyan);text-decoration:none;font-weight:600">Inicia sesión</a></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="api.js"></script>
    <script>
        let currentStep = 1;
        function updateSteps() {
            for (let i = 1; i <= 3; i++) {
                const indicator = document.getElementById(`step${i}-indicator`);
                const content = document.getElementById(`step${i}`);
                if (i === currentStep) {
                    indicator.classList.add('active'); indicator.classList.remove('completed');
                    content.classList.add('active');
                } else if (i < currentStep) {
                    indicator.classList.remove('active'); indicator.classList.add('completed');
                    indicator.querySelector('.step-number').innerHTML = '✓';
                    content.classList.remove('active');
                } else {
                    indicator.classList.remove('active', 'completed');
                    indicator.querySelector('.step-number').innerHTML = i;
                    content.classList.remove('active');
                }
            }
        }
        function nextStep(step) {
            const currentContent = document.getElementById(`step${currentStep}`);
            const requiredFields = currentContent.querySelectorAll('[required]');
            let valid = true;
            requiredFields.forEach(field => {
                if (!field.value.trim()) { field.style.borderColor = 'var(--accent-danger)'; valid = false; setTimeout(() => { field.style.borderColor = ''; }, 3000); }
            });
            if (!valid) { showToast('Completa todos los campos obligatorios', 'warning'); return; }
            currentStep = step; updateSteps();
        }
        function prevStep(step) { currentStep = step; updateSteps(); }
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (password !== confirm) { showToast('Las contraseñas no coinciden', 'error'); return; }
            if (password.length < 6) { showToast('La contraseña debe tener al menos 6 caracteres', 'warning'); return; }
            const btn = document.getElementById('registroBtn');
            btn.innerHTML = '<span>⏳ Procesando...</span>'; btn.disabled = true;
            const data = {
                nombre: document.getElementById('nombre').value, apellido: document.getElementById('apellido').value,
                cedula: document.getElementById('cedula').value, fechaNac: document.getElementById('fechaNac').value,
                ciudad: document.getElementById('ciudad').value, direccion: document.getElementById('direccion').value,
                email: document.getElementById('email').value, celular: document.getElementById('celular').value,
                fotoPerfil: document.getElementById('fotoPerfil').value, tipoVehiculo: document.getElementById('tipoVehiculo').value,
                placa: document.getElementById('placa').value, marca: document.getElementById('marca').value,
                modelo: document.getElementById('modelo').value, capacidad: document.getElementById('capacidad').value,
                soat: document.getElementById('soat').value, tecnomecanica: document.getElementById('tecnomecanica').value,
                licencia: document.getElementById('licencia').value, banco: document.getElementById('banco').value,
                tipoCuenta: document.getElementById('tipoCuenta').value, numCuenta: document.getElementById('numCuenta').value,
                titular: document.getElementById('titular').value, password: password
            };
            try {
                const result = await registrarConductor(data);
                if (result.success) {
                    showToast('¡Registro exitoso! Redirigiendo...', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else { showToast(result.message, 'error'); btn.innerHTML = '<span>✅ Completar registro</span>'; btn.disabled = false; }
            } catch (error) { showToast('Error al registrar. Intenta de nuevo.', 'error'); btn.innerHTML = '<span>✅ Completar registro</span>'; btn.disabled = false; }
        });
    </script>
</body>
</html>
